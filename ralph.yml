# Ralph Orchestrator — Anastasia Heartfelt Journey
# Production audit + ship. Backend: Hermes (custom). No Codex. Deploy: Vercel (Nitro).

cli:
  backend: "custom"
  command: ".ralph/bin/hermes-backend"
  prompt_mode: "arg"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 60

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  specs_dir: ".ralph/specs/"
  guardrails:
    - "Never reintroduce Lovable or Netlify deploy packages/config."
    - "Never commit or print secrets (.env, SUPABASE_SERVICE_ROLE_KEY, ADMIN_SETUP_SECRET, GEMINI_API_KEY)."
    - "Ship builds use NITRO_PRESET=vercel (bun run build:vercel / gate)."
    - "EN public page changes need matching el.* twin + meta/hreflang discipline."
    - "Prefer small verified slices; run bun run gate after material changes."
    - "Do not invent a production domain; set SITE_URL from real Vercel/custom domain."
