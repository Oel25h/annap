name: Gate

on:
  push:
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start the local database
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          ./scripts/write-local-env.sh

      - name: Install the browser for end-to-end tests
        run: bunx playwright install --with-deps chromium

      - name: Gate
        run: bun run gate
        env:
          CI: "true"

      - name: Keep test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # Deploys only ever come from this green gate. Until the Cloudflare
      # token exists as a repository secret, the deploy step is skipped.
      - name: Check for deploy credentials
        id: deploy
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.deploy.outputs.ready == 'true'
        run: bunx wrangler deploy -c .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Previews run as a separate worker with its own secrets (docs/redo-brief.md 3.1);
      # never as a version of the production worker, which holds production keys.
