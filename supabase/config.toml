project_id = "extyqqkasmchctvoltbm"
[auth]
site_url = "http://127.0.0.1:8787"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
# Signup is closed: the first admin is created with ADMIN_SETUP_SECRET and
# later admins are invited from the studio.
enable_signup = false

[auth.email]
# The CLI reads this as "email and password sign-in is on" (GOTRUE_EXTERNAL_EMAIL_ENABLED).
# Sign-up stays closed through [auth] enable_signup above; false here turned off sign-in too.
enable_signup = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
